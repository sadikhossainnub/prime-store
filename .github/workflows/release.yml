name: Build APK and Create GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Release APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK File
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Amer Dokan-${{ github.ref_name }}.apk"

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/Amer Dokan-${{ github.ref_name }}.apk
          name: Amer Dokan ${{ github.ref_name }}
          body: |
            ## 📱 Amer Dokan Release ${{ github.ref_name }}

            ### 📦 Attached Asset:
            - **Amer Dokan-${{ github.ref_name }}.apk** (Android Production APK)

            ### ✨ Features in this release:
            - 📊 **Excel/CSV Data Restore & Importer** (Multi-sheet support & automatic column matching)
            - 🔒 **Admin Protection** (Password protected settings & backup management)
            - 💾 **Local 3-Day Hidden Auto Backup** (Automatic `.db` backup every 72 hours)
            - 🗑️ **Customer Transaction Deletion** (Delete individual baki/payment with Recycle Bin support)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
